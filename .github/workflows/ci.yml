name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate API, frontend, and OpenWebUI compatibility Compose files
        env:
          LIVABILITY_API_KEY: ci-livability-key
          OPENWEBUI_ADMIN_ENV_FILE: .env.backend.example
          PUBLIC_URL: https://ci.example.com
        run: |
          docker compose --env-file .env.backend.example config --quiet
          docker compose --env-file .env.backend.example \
            -f compose.yaml -f compose.public.yaml config --quiet
          docker compose --env-file .env.backend.example \
            -f compose.yaml -f compose.openwebui.override.yaml config --quiet
