name: livability-agent

x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${http_proxy:-${HTTP_PROXY:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  HTTPS_PROXY: ${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}
  ALL_PROXY: ${all_proxy:-${ALL_PROXY:-}}
  all_proxy: ${all_proxy:-${ALL_PROXY:-}}
  NO_PROXY: "${NO_PROXY:-}${NO_PROXY:+,}${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,livability-agent-api,openwebui"
  no_proxy: "${NO_PROXY:-}${NO_PROXY:+,}${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,livability-agent-api,openwebui"

x-proxy-runtime-environment: &proxy-runtime-environment
  HTTP_PROXY: ${http_proxy:-${HTTP_PROXY:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  HTTPS_PROXY: ${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}
  ALL_PROXY: ${all_proxy:-${ALL_PROXY:-}}
  all_proxy: ${all_proxy:-${ALL_PROXY:-}}
  NO_PROXY: "${NO_PROXY:-}${NO_PROXY:+,}${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,livability-agent-api,openwebui"
  no_proxy: "${NO_PROXY:-}${NO_PROXY:+,}${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,livability-agent-api,openwebui"

services:
  livability-open-data-sync:
    build:
      context: .
      args: *proxy-build-args
    command:
      - python
      - -m
      - livability_demo.sync_container
      - --if-enabled
      - --allow-stale
    env_file:
      - path: .env.backend
        required: false
    environment:
      <<: *proxy-runtime-environment
      OPEN_DATA_DIR: /data/open-data
      LIVABILITY_HOST_UID: "${LIVABILITY_HOST_UID:-}"
      LIVABILITY_HOST_GID: "${LIVABILITY_HOST_GID:-}"
    # Bootstrap selects the mount owner, then drops to that UID/GID before syncing.
    user: "0:0"
    volumes:
      - ./open_data:/data/open-data
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"
    networks:
      - livability-internal

  livability-agent-api:
    build:
      context: .
      args: *proxy-build-args
    env_file:
      - path: .env.backend
        required: false
    environment:
      <<: *proxy-runtime-environment
      API_HOST: 0.0.0.0
      API_PORT: 8091
      LIVABILITY_API_KEY: "${LIVABILITY_API_KEY:?Set LIVABILITY_API_KEY in .env.backend and pass --env-file .env.backend}"
      OUTPUTS_DIR: /data/outputs
    ports:
      - "${LIVABILITY_API_BIND_ADDRESS:-127.0.0.1}:${LIVABILITY_API_PORT:-8091}:8091"
    depends_on:
      livability-open-data-sync:
        condition: service_completed_successfully
    volumes:
      - livability-outputs:/data/outputs
      - ./open_data:/data/open-data:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - livability-internal

  livability-agent-frontend:
    build:
      context: ./frontend
      args: *proxy-build-args
    environment:
      LIVABILITY_API_KEY: "${LIVABILITY_API_KEY:?Set LIVABILITY_API_KEY in .env.backend and pass --env-file .env.backend}"
    ports:
      - "${LIVABILITY_FRONTEND_BIND_ADDRESS:-0.0.0.0}:${LIVABILITY_FRONTEND_PORT:-5173}:8080"
    depends_on:
      livability-agent-api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8080/
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - livability-internal

volumes:
  livability-outputs:

networks:
  livability-internal:
    name: ${LIVABILITY_INTERNAL_NETWORK_NAME:-livability-agent-internal}
