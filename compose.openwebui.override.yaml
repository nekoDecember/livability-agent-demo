services:
  livability-agent-api:
    networks:
      openwebui-agent-network:
        aliases:
          - livability-agent-api

  register-livability-pipe:
    image: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    depends_on:
      livability-agent-api:
        condition: service_healthy
    env_file:
      - path: .env.backend
        required: false
      - path: ${OPENWEBUI_ADMIN_ENV_FILE:?Set OPENWEBUI_ADMIN_ENV_FILE to the OpenWebUI .env.admin path}
        required: true
    environment:
      PIPE_PATH: /registration/livability_agent_pipe.py
    volumes:
      - ./openwebui/livability_agent_pipe.py:/registration/livability_agent_pipe.py:ro
      - ./scripts/register_openwebui_pipe.py:/registration/register_openwebui_pipe.py:ro
    command:
      - python
      - /registration/register_openwebui_pipe.py
    networks:
      - openwebui-agent-network
    labels:
      service-manager.lifecycle: oneshot
    restart: "no"

networks:
  openwebui-agent-network:
    external: true
    name: openwebui-agent-network
