[project]
name = "livability-agent-demo"
version = "0.2.0"
description = "Microsoft Agent Framework multi-agent PoC for Japanese municipality livability assessments"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-framework-core==1.13.0",
    "agent-framework-devui==1.0.0b260813",
    "agent-framework-openai==1.13.0",
    "fastapi>=0.116,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
livability-devui = "livability_demo.app:main"
livability-run = "livability_demo.cli:main"
livability-api = "livability_demo.api:main"
livability-open-data-build = "livability_demo.open_data_cli:main"
livability-open-data-sync = "livability_demo.official_data_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livability_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
